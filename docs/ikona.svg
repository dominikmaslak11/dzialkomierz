       Bez napisu — przy 48 px na ekranie telefonu litery i tak zlewają się w plamę. -->
  <rect width="512" height="512" rx="112" fill="#1b5e20"/>
  <path d="M104 356 L168 158 L392 196 L344 388 Z"
        fill="rgba(255,214,0,.20)" stroke="#ffd600" stroke-width="20"
        stroke-linejoin="round"/>
